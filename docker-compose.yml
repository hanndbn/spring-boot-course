version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: course-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coursedb
      POSTGRES_USER: course_admin
      POSTGRES_PASSWORD: course_secret_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_admin -d coursedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: course-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coursedb
      SPRING_DATASOURCE_USERNAME: course_admin
      SPRING_DATASOURCE_PASSWORD: course_secret_123
      APP_JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: course-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
