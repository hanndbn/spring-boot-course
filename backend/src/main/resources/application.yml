server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: spring-boot-course-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:coursedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5500"
      - "http://localhost:8080"
      - "http://127.0.0.1:5500"
      - "https://hanndbn.github.io"

logging:
  level:
    com.mastery.course: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Production Profile with PostgreSQL (Default container)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/coursedb}
    username: ${SPRING_DATASOURCE_USERNAME:course_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:course_secret_123}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false

---
# Supabase Cloud PostgreSQL Profile
spring:
  config:
    activate:
      on-profile: supabase

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.rdtvdhliqnbflqstatsq.supabase.co:5432/postgres?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  h2:
    console:
      enabled: false
